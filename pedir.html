<style>
  :root {
    --yellow: #FFC533;
    --ink: #1F1F1F;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--ink);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  img { display: block; }

  .logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    margin-bottom: 32px;
    opacity: 0;
    transform: scale(0.9);
    animation: appear 0.4s ease 0.1s forwards;
  }

  .label {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.01em;
    opacity: 0;
    animation: appear 0.4s ease 0.25s forwards;
  }

  .dots {
    display: inline-flex;
    gap: 5px;
    margin-left: 2px;
    vertical-align: middle;
  }
  .dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--yellow);
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  .fallback {
    margin-top: 28px;
    font-size: 13px;
    color: rgba(255,255,255,0.25);
    opacity: 0;
    animation: appear 0.4s ease 1.2s forwards;
  }
  .fallback a {
    color: var(--yellow);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  @keyframes appear {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40%           { opacity: 1;    transform: scale(1); }
  }
</style>

<body>

<img class="logo" src="logo.svg" alt="Fastgas" />
<p class="label">
  Redirecionando para o WhatsApp<span class="dots"><span></span><span></span><span></span></span>
</p>

  Não foi redirecionado? <a href="https://wa.me/c/554831970675" id="wa-link">Clique aqui</a>
</p>
